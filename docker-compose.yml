version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: hr_postgres_db
    restart: always
    environment:
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_password
      POSTGRES_DB: hr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_user -d hr_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_management_api
    restart: always
    environment:
      APP_NAME: "Regent HR Management API (Docker Mode)"
      APP_ENV: "production"
      DEBUG: "False"
      DATABASE_URL: "postgresql://hr_user:hr_password@db:5432/hr_db"
      SECRET_KEY: "academic-demonstration-secret-key-change-in-production-environments"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      FIRST_SUPERADMIN_EMAIL: "admin@regent.ac.uk"
      FIRST_SUPERADMIN_PASSWORD: "AdminPassword123!"
      FIRST_SUPERADMIN_FULL_NAME: "System Administrator"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python scripts/create_admin.py &&
             python scripts/seed_demo_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
